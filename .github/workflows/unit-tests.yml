name: keycard-module Unit Tests

# The core against the Keycard applet itself, built from its source at 4.0 and 3.2 and run in
# jCardSim by `nix run .#simulator`. `--no-default-features` drops the Logos glue and PC/SC, but
# cargo still resolves the SDK's manifest, so it is checked out beside the crate.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: unit-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-test:
    name: cargo test (against simulated cards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix and set up the shared cache
        uses: logos-co/setup-nix-cache-action@v1
        with:
          attic-token-ci: ${{ secrets.ATTIC_TOKEN_CI }}
          attic-token-public: ${{ secrets.ATTIC_TOKEN_PUBLIC }}

      - name: Start a 4.0 and a 3.2 Keycard
        run: |
          nix run .#simulator -- 47331 > card40.log 2>&1 &
          nix run .#simulator -- 47332 3.2 > card32.log 2>&1 &
          for i in $(seq 1 300); do grep -q ready card40.log && grep -q ready card32.log && break; sleep 2; done
          cat card40.log card32.log
          grep -q ready card40.log && grep -q ready card32.log

      # rust-lib's rust-version, the builder's rustc: a pass here can't fail the real build on MSRV.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: clippy, rustfmt
      - name: Provide the SDK manifest cargo resolves
        uses: actions/checkout@v4
        with:
          repository: logos-co/logos-rust-sdk
          path: logos-rust-sdk-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-lib

      - name: cargo test, against both cards
        env:
          KEYCARD_SIMULATOR: "127.0.0.1:47331"
          KEYCARD_SIMULATOR_V3: "127.0.0.1:47332"
          KEYCARD_SIMULATOR_REQUIRED: "1"
        # Zero tests also reports success, so the count must be above the simulator tests'.
        run: |
          set -o pipefail
          cd rust-lib
          cargo test --locked --no-default-features --features simulator 2>&1 | tee /tmp/unit.log
          ran=$(grep -oE '^test result: ok\. [0-9]+ passed' /tmp/unit.log | awk '{s+=$4} END {print s+0}')
          echo "tests run: $ran"
          [ "$ran" -ge 11 ]

      - name: clippy and rustfmt
        run: |
          sudo apt-get install -y --no-install-recommends libpcsclite-dev
          cd rust-lib
          cargo clippy --locked --no-default-features --features pcsc,simulator --all-targets -- -D warnings
          cargo fmt --check

      - name: Every contract method must be documented
        run: |
          methods=$(grep -E '^    fn [a-z_]+\(.*;$' rust-lib/src/glue.rs | grep -oE 'fn [a-z_]+' | awk '{print $2}' | sort -u)
          missing=0
          for m in $methods; do
            grep -q "\`$m\`" docs/specs.md || { echo "UNDOCUMENTED: $m"; missing=1; }
          done
          echo "checked $(echo "$methods" | wc -w) contract methods"
          exit $missing
